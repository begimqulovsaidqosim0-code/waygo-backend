<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${title})}"></head>
<body>
    <div th:replace="~{admin/fragments :: sidebar('orders')}"></div>

    <div class="main-content">
        <h1 th:text="${title}">Buyurtmalar</h1>
        
        <div class="card" style="margin-top: 2rem;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Mijoz</th>
                        <th>Haydovchi</th>
                        <th>Yo'nalish</th>
                        <th>Narxi</th>
                        <th>Status</th>
                        <th>Sana</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="'#' + ${order.id}">#101</td>
                        <td>
                            <div style="font-weight: 500;" th:text="${order.passenger != null ? (order.passenger.fullName != null ? order.passenger.fullName : 'No Name') : 'Yo''lovchi yo''q'}">Mijoz</div>
                            <div style="font-size: 0.75rem; color: var(--text-dim);" th:text="${order.passenger != null ? order.passenger.phone : '-'}">+998...</div>
                        </td>
                        <td>
                            <div th:if="${order.driver != null}">
                                <div style="font-weight: 500;" th:text="${order.driver.fullName != null ? order.driver.fullName : 'No Name'}">Haydovchi</div>
                                <div style="font-size: 0.75rem; color: var(--text-dim);" th:text="${order.driver.phone}">+998...</div>
                            </div>
                            <div th:unless="${order.driver != null}" style="color: var(--pending); font-style: italic; font-size: 0.85rem;">
                                Qidirilmoqda...
                            </div>
                        </td>
                        <td>
                            <div style="font-weight: 500;" th:text="${order.fromAddress}">Chilonzor</div>
                            <div style="color: var(--text-dim); font-size: 0.8rem;" th:text="${order.toAddress}">Yunusobod</div>
                        </td>
                        <td style="font-weight: 600;" th:text="${#numbers.formatDecimal(order.price, 0, 'COMMA', 0, 'POINT')} + ' UZS'">15k</td>
                        <td>
                            <span class="status-badge" 
                                  th:classappend="${'status-' + #strings.toLowerCase(order.status)}"
                                  th:text="${order.status}">PENDING</span>
                        </td>
                        <td style="color: var(--text-dim); font-size: 0.85rem;" th:text="${#temporals.format(order.createdAt, 'dd.MM HH:mm')}">Date</td>
                        <td style="text-align: right;">
                            <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn-icon"
                               style="color: var(--text-dim); background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 0.5rem; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;"
                               title="Batafsil">
                                <i class="ph ph-eye"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="8" style="text-align: center; color: var(--text-dim); padding: 5rem;">Tizimda hali buyurtmalar mavjud emas</td>
                    </tr>
                </tbody>
            </table>

            <div th:if="${page.totalPages > 0}"
                 style="display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                <div style="color: var(--text-dim); font-size: 0.85rem;">
                    Jami <span th:text="${page.totalElements}">0</span> ta buyurtma,
                    <span th:text="${page.number + 1}">1</span>/<span th:text="${page.totalPages}">1</span>-sahifa
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <a th:if="${page.hasPrevious()}"
                       th:href="@{/admin/orders(page=${page.number - 1}, size=${page.size})}"
                       class="btn btn-outline">Oldingi</a>
                    <span th:unless="${page.hasPrevious()}" class="btn btn-outline" style="opacity: 0.4; pointer-events: none;">Oldingi</span>

                    <a th:if="${page.hasNext()}"
                       th:href="@{/admin/orders(page=${page.number + 1}, size=${page.size})}"
                       class="btn btn-primary">Keyingi</a>
                    <span th:unless="${page.hasNext()}" class="btn btn-outline" style="opacity: 0.4; pointer-events: none;">Keyingi</span>
                </div>
            </div>
        </div>
    </div>
<script th:replace="~{admin/fragments :: scripts}"></script>
</body>
</html>
